# Merge this into ~/.omp/agent/models.yml.
# Current gateway support is best for advisory/review prompts, not full tool-loop backend use.

providers:
  local-fusion:
    name: Local Fusion Gateway
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    apiKey: $LOCAL_FUSION_API_KEY
    auth: apiKey
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
      supportsStore: false
      supportsUsageInStreaming: false
      maxTokensField: max_tokens
    models:
      - id: local/fusion
        name: Local Fusion Gateway
        reasoning: false
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
